<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 4rem;
        }

        .hero {
            background: #212121;
            color: white;
            text-align: center;
        }

        .hero h2 {
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 30px;
        }

        .cta-buttons {
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            margin-top: 4rem;
        }

        .cta-button {
            display: inline-block;
            background-color: #e85430;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 2.5rem;
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            background-color: #c0392b;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .cta-button.secondary {
            background-color: #e85430;
        }

        .cta-button.secondary:hover {
            background-color: #c0392b;
        }

        .features {
            padding: 60px 0;
            background-color: white;
        }

        .features h3 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 40px;
            color: #2c3e50;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-10px);
        }

        .feature-card h4 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #e74c3c;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 60px;
        }
    </style>
</head>

<body>
    <section class="hero">
        <div class="container">
            <h1>University Portal</h1>
            <p>Your all-in-one tool for managing everthing in the University.</p>

            <div class="cta-buttons">
                <a href="professors.php" class="cta-button secondary">Professors Portal</a>
                <a href="students.php" class="cta-button">Students Portal</a>
            </div>
        </div>
    </section>
</body>

</html>
